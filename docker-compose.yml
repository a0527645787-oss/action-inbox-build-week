services:
  actioninbox:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/actioninbox.db
      LOCAL_DEMO_AUTH_ENABLED: ${LOCAL_DEMO_AUTH_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CA_BUNDLE: ${OPENAI_CA_BUNDLE:-}
      ACTIONINBOX_SHEETS_ENABLED: ${ACTIONINBOX_SHEETS_ENABLED:-false}
      ACTIONINBOX_SHEET_ID: ${ACTIONINBOX_SHEET_ID:-}
      ACTIONINBOX_SHEET_TAB: ${ACTIONINBOX_SHEET_TAB:-}
    volumes:
      - actioninbox_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
  execution-worker:
    build: .
    command: ["python", "-m", "app.execution_worker"]
    environment:
      DATABASE_URL: sqlite:////data/actioninbox.db
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-session-secret-change-me-123456}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CA_BUNDLE: ${OPENAI_CA_BUNDLE:-}
      ACTIONINBOX_SHEETS_ENABLED: ${ACTIONINBOX_SHEETS_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      ACTIONINBOX_SHEET_ID: ${ACTIONINBOX_SHEET_ID:-}
      ACTIONINBOX_SHEET_TAB: ${ACTIONINBOX_SHEET_TAB:-}
    volumes:
      - actioninbox_data:/data
    depends_on:
      actioninbox:
        condition: service_healthy
  gmail-sync-worker:
    build: .
    command: ["python", "-m", "app.gmail_sync_worker"]
    environment:
      DATABASE_URL: sqlite:////data/actioninbox.db
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - actioninbox_data:/data
    depends_on:
      actioninbox:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: actioninbox
      MYSQL_USER: actioninbox
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pilot-test-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pilot-test-root-password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uactioninbox -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
  actioninbox-mysql:
    build: .
    profiles: ["mysql"]
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: mysql+pymysql://actioninbox:${MYSQL_PASSWORD:-pilot-test-password}@mysql:3306/actioninbox?charset=utf8mb4
      LOCAL_DEMO_AUTH_ENABLED: "true"
      OPENAI_API_KEY: ""
      ACTIONINBOX_SHEETS_ENABLED: ${ACTIONINBOX_SHEETS_ENABLED:-false}
      ACTIONINBOX_SHEET_ID: ${ACTIONINBOX_SHEET_ID:-}
      ACTIONINBOX_SHEET_TAB: ${ACTIONINBOX_SHEET_TAB:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  execution-worker-mysql:
    build: .
    profiles: ["mysql"]
    command: ["python", "-m", "app.execution_worker"]
    environment:
      DATABASE_URL: mysql+pymysql://actioninbox:${MYSQL_PASSWORD:-pilot-test-password}@mysql:3306/actioninbox?charset=utf8mb4
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-session-secret-change-me-123456}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ACTIONINBOX_SHEETS_ENABLED: ${ACTIONINBOX_SHEETS_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      ACTIONINBOX_SHEET_ID: ${ACTIONINBOX_SHEET_ID:-}
      ACTIONINBOX_SHEET_TAB: ${ACTIONINBOX_SHEET_TAB:-}
    depends_on:
      actioninbox-mysql:
        condition: service_healthy
  gmail-sync-worker-mysql:
    build: .
    profiles: ["mysql"]
    command: ["python", "-m", "app.gmail_sync_worker"]
    environment:
      DATABASE_URL: mysql+pymysql://actioninbox:${MYSQL_PASSWORD:-pilot-test-password}@mysql:3306/actioninbox?charset=utf8mb4
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:8001/auth/google/callback}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    depends_on:
      actioninbox-mysql:
        condition: service_healthy
volumes:
  actioninbox_data:
  mysql_data:
