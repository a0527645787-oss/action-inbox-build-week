name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: actioninbox-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 with Systems Manager
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy pushed commit through SSM
        shell: bash
        env:
          INSTANCE_ID: i-00d5b992e63484d51
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          parameters_file="$(mktemp)"
          trap 'rm -f "$parameters_file"' EXIT

          jq -n \
            --arg sha "$DEPLOY_SHA" \
            '{
              commands: [
                "set -Eeuo pipefail",
                "cd /opt/actioninbox/repo",
                "git fetch origin main",
                ("git checkout --detach " + $sha),
                "sudo docker compose --env-file /opt/actioninbox/.env -f deploy/docker-compose.production.yml up --build --detach",
                "healthy=0; for attempt in $(seq 1 60); do if curl --fail --silent --show-error http://127.0.0.1/health >/dev/null; then healthy=1; break; fi; sleep 5; done; [ \"$healthy\" -eq 1 ]"
              ]
            }' > "$parameters_file"

          command_id="$(
            aws ssm send-command \
              --region eu-north-1 \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy ActionInbox $DEPLOY_SHA" \
              --timeout-seconds 900 \
              --parameters "file://$parameters_file" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command submitted: $command_id"

          final_status=""
          for attempt in $(seq 1 90); do
            status="$(
              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"

            case "$status" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                final_status="$status"
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          if [ -z "$final_status" ]; then
            echo "SSM deployment did not reach a terminal state before timeout" >&2
            exit 1
          fi

          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          if [ "$final_status" != "Success" ]; then
            echo "SSM deployment failed with status: $final_status" >&2
            exit 1
          fi

          echo "Production deployment and health check succeeded for $DEPLOY_SHA"
