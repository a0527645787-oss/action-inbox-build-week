name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actioninbox-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: ""
        run: pytest -q

      - name: Build application image
        run: docker build --tag actioninbox:${{ github.sha }} .

      - name: Diagnose production TLS and health
        shell: bash
        run: |
          set -uo pipefail

          diagnose_health() {
            local url="$1"
            local host="${url#https://}"
            local work_dir curl_status http_status body verify_result cert_count
            local curl_error certificate_details chain_status annotation annotation_level
            host="${host%%/*}"
            work_dir="$(mktemp -d)"

            echo "::group::TLS and health diagnostics for $url"

            http_status="$(
              curl -v --fail --connect-timeout 10 --max-time 30 \
                --output "$work_dir/body" \
                --write-out '%{http_code}' \
                "$url" 2>"$work_dir/curl-verified.log"
            )"
            curl_status=$?
            cat "$work_dir/curl-verified.log"

            if [ "$curl_status" -eq 0 ]; then
              body="$(cat "$work_dir/body")"
              printf 'VERIFIED_RESULT url=%s tls=verified http_status=%s body=%s\n' \
                "$url" "$http_status" "$body"
              if [ "$http_status" != "200" ] || [ "$body" != '{"status":"ok"}' ]; then
                curl_status=1
              fi
            else
              printf 'VERIFIED_RESULT url=%s tls=failed curl_exit=%s\n' \
                "$url" "$curl_status"
            fi

            openssl s_client \
              -connect "$host:443" \
              -servername "$host" \
              -showcerts \
              -verify_return_error \
              </dev/null >"$work_dir/openssl.log" 2>&1
            cat "$work_dir/openssl.log"

            awk -v dir="$work_dir" '
              /-----BEGIN CERTIFICATE-----/ {
                count += 1
                file = sprintf("%s/cert-%02d.pem", dir, count)
                writing = 1
              }
              writing { print > file }
              /-----END CERTIFICATE-----/ { writing = 0 }
            ' "$work_dir/openssl.log"

            cert_count="$(find "$work_dir" -name 'cert-*.pem' -type f | wc -l)"
            printf 'SERVER_CERTIFICATE_COUNT=%s\n' "$cert_count"
            if [ -f "$work_dir/cert-01.pem" ]; then
              openssl x509 -in "$work_dir/cert-01.pem" -noout \
                -subject -issuer -startdate -enddate -ext subjectAltName
            else
              echo "LEAF_CERTIFICATE=unavailable"
            fi

            verify_result="$(
              grep -E 'Verify return code:|Verification error:' \
                "$work_dir/openssl.log" || true
            )"
            if printf '%s' "$verify_result" | grep -q 'Verify return code: 0 (ok)'; then
              chain_status="verified_complete"
            else
              chain_status="not_verified"
            fi
            echo "CERTIFICATE_CHAIN=$chain_status"

            if [ "$curl_status" -ne 0 ]; then
              diagnostic_status="$(
                curl -k --silent --show-error \
                  --connect-timeout 10 --max-time 30 \
                  --output "$work_dir/insecure-body" \
                  --write-out '%{http_code}' \
                  "$url" || true
              )"
              printf 'INSECURE_DIAGNOSTIC_ONLY url=%s http_status=%s body=%s\n' \
                "$url" "$diagnostic_status" \
                "$(cat "$work_dir/insecure-body" 2>/dev/null || true)"
            fi

            curl_error="$(
              grep -E '^curl: \([0-9]+\)' "$work_dir/curl-verified.log" \
                | tail -n 1 || true
            )"
            if [ -f "$work_dir/cert-01.pem" ]; then
              certificate_details="$(
                openssl x509 -in "$work_dir/cert-01.pem" -noout \
                  -subject -issuer -startdate -enddate -ext subjectAltName \
                  | tr '\n' ';'
              )"
            else
              certificate_details="leaf certificate unavailable"
            fi
            annotation="url=$url | curl_error=${curl_error:-none} | $certificate_details | chain=$chain_status | verified_http_status=${http_status:-none}"
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\r'/'%0D'}"
            annotation="${annotation//$'\n'/'%0A'}"
            if [ "$curl_status" -eq 0 ]; then
              annotation_level="notice"
            else
              annotation_level="error"
            fi
            printf '::%s title=TLS diagnostic for %s::%s\n' \
              "$annotation_level" "$host" "$annotation"
            {
              printf '### `%s`\n\n' "$url"
              printf -- '- Verified curl result: `%s`\n' \
                "$([ "$curl_status" -eq 0 ] && echo passed || echo failed)"
              printf -- '- Exact curl error: `%s`\n' "${curl_error:-none}"
              printf -- '- Certificate: `%s`\n' "$certificate_details"
              printf -- '- Server certificate count: `%s`\n' "$cert_count"
              printf -- '- Certificate chain: `%s`\n' "$chain_status"
              printf -- '- Verified HTTP status: `%s`\n\n' "${http_status:-none}"
            } >>"$GITHUB_STEP_SUMMARY"

            echo "::endgroup::"
            return "$curl_status"
          }

          overall_status=0
          diagnose_health https://actioninboxapp.com/health || overall_status=1
          diagnose_health https://www.actioninboxapp.com/health || overall_status=1
          exit "$overall_status"

  deploy:
    name: Deploy to EC2 through SSM
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[diagnostic-only]')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy tested commit through SSM
        shell: bash
        env:
          INSTANCE_ID: i-00d5b992e63484d51
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          parameters_file="$(mktemp)"
          trap 'rm -f "$parameters_file"' EXIT

          python - "$parameters_file" <<'PY'
          import json
          import os
          import sys

          sha = os.environ["DEPLOY_SHA"]
          commands = [
              "set -eu",
              "test -f /opt/actioninbox/.env",
              "test -d /opt/actioninbox/repo/.git",
              "sudo -u ubuntu git -C /opt/actioninbox/repo fetch origin main",
              f"sudo -u ubuntu git -C /opt/actioninbox/repo checkout --detach {sha}",
              "cd /opt/actioninbox/repo",
              (
                  'if ! sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml up --build --detach; then '
                  'echo "Docker Compose deployment failed" >&2; '
                  'sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml ps; '
                  'sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml logs --tail 80 actioninbox nginx; '
                  'exit 1; fi'
              ),
              (
                  'healthy=0; attempt=1; while [ "$attempt" -le 60 ]; do '
                  'if sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml exec -T actioninbox '
                  'python -c "import urllib.request; '
                  'response=urllib.request.urlopen(\\"http://127.0.0.1:8000/health\\", timeout=5); '
                  'assert response.status == 200"; '
                  'then healthy=1; break; fi; sleep 5; attempt=$((attempt + 1)); done'
              ),
              (
                  'if [ "$healthy" -ne 1 ]; then '
                  'echo "Application health check failed" >&2; '
                  'sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml ps; '
                  'sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml logs --tail 80 actioninbox nginx; '
                  'exit 1; fi'
              ),
              (
                  'http_status=$(curl --silent --show-error --output /dev/null '
                  '--write-out "%{http_code}" '
                  '--resolve actioninbox.16-192-83-71.nip.io:443:127.0.0.1 '
                  'https://actioninbox.16-192-83-71.nip.io/health); '
                  'if [ "$http_status" != 200 ]; then '
                  'echo "Nginx HTTPS health check failed with HTTP $http_status" >&2; '
                  'sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml ps; '
                  'sudo docker compose --env-file /opt/actioninbox/.env '
                  '-f deploy/docker-compose.production.yml logs --tail 80 actioninbox nginx; '
                  'exit 1; fi'
              ),
              f'echo "Deployment succeeded for {sha}"',
          ]

          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({"commands": commands}, handle)
          PY

          python -m json.tool "$parameters_file" >/dev/null

          command_id="$(
            aws ssm send-command \
              --region eu-north-1 \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy ActionInbox $DEPLOY_SHA" \
              --timeout-seconds 900 \
              --parameters "file://$parameters_file" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command submitted: $command_id"

          final_status=""
          for attempt in $(seq 1 90); do
            status="$(
              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"

            case "$status" in
              Success|Failed|TimedOut|Cancelled|Cancelling)
                final_status="$status"
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          if [ -z "$final_status" ]; then
            echo "SSM command did not reach a terminal state before timeout" >&2
            exit 1
          fi

          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          if [ "$final_status" != Success ]; then
            echo "SSM deployment failed with status: $final_status" >&2
            exit 1
          fi

          echo "Production deployment and health checks succeeded for $DEPLOY_SHA"
