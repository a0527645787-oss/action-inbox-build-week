name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actioninbox-production
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: ""
        run: pytest -q

      - name: Build application image
        run: docker build --tag actioninbox:${{ github.sha }} .

  deploy:
    name: Deploy to EC2
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_PRIVATE_KEY"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/actioninbox
          chmod 600 ~/.ssh/actioninbox
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/actioninbox "$EC2_USER@$EC2_HOST" "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          commit="$1"
          cd /opt/actioninbox/repo

          test -f /opt/actioninbox/.env
          test -z "$(git status --porcelain)"
          git fetch --prune origin main
          git checkout main
          git merge --ff-only "$commit"

          docker compose \
            --env-file /opt/actioninbox/.env \
            -f deploy/docker-compose.production.yml \
            up --build --detach --remove-orphans

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            http://127.0.0.1/health
          REMOTE

      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://actioninbox.16-192-83-71.nip.io/health
