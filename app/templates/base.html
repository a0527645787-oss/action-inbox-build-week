<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}ActionInbox{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/execution.css">
  <link rel="stylesheet" href="/static/integrations.css">
  {% block page_styles %}{% endblock %}
</head>
<body>
<header>
  <a class="brand" href="/">ActionInbox</a>
  {% if current_user %}
  <nav>
    <a href="/inbox">Inbox</a>
    <a href="/dashboard">Dashboard</a>
    {% if current_user.id != "00000000-0000-0000-0000-000000000001" %}
    <a href="/gmail">Gmail</a>
    <a href="/resources">Resources</a>
    {% endif %}
    <a href="/integrations">Work &amp; Codex</a>
    <form method="post" action="/logout">
      <button class="nav-button" type="submit">Logout</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
</body>
</html>
